version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gagandeep1611", email = "gagandeep161198@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "black>=26.5.1",
    "isort>=8.0.1",
    "langchain>=1.3.15",
    "langchain-openai>=1.5.0",
